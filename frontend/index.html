<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CashFlow - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>CashFlow</h1>
        <p class="subtitle">Personal Finance Tracker</p>
      </div>

      <!-- Login Form -->
      <div id="loginForm" class="auth-form active">
        <h2>Login</h2>
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="your@email.com" required>
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn-primary">Login</button>
          <div id="login-error" class="error-message"></div>
        </form>
        <p class="form-toggle">Don't have an account? <a href="#" onclick="toggleForm(event)">Register</a></p>
      </div>

      <!-- Register Form -->
      <div id="registerForm" class="auth-form">
        <h2>Register</h2>
        <form onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="register-name">Full Name</label>
            <input type="text" id="register-name" placeholder="John Doe" required>
          </div>
          <div class="form-group">
            <label for="register-email">Email</label>
            <input type="email" id="register-email" placeholder="your@email.com" required>
          </div>
          <div class="form-group">
            <label for="register-password">Password</label>
            <input type="password" id="register-password" placeholder="••••••••" minlength="6" required>
          </div>
          <button type="submit" class="btn-primary">Register</button>
          <div id="register-error" class="error-message"></div>
        </form>
        <p class="form-toggle">Already have an account? <a href="#" onclick="toggleForm(event)">Login</a></p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
