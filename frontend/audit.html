<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CashFlow - Audit Logs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>CashFlow</h1>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link">
          <span class="icon">📊</span> Dashboard
        </a>
        <a href="transactions.html" class="nav-link">
          <span class="icon">💳</span> Transactions
        </a>
        <a href="audit.html" class="nav-link active">
          <span class="icon">📋</span> Audit Logs
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <p id="user-name">User</p>
          <p id="user-email" class="user-email">email@example.com</p>
        </div>
        <button class="btn-logout" onclick="logout()">Logout</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="header">
        <h2>Audit Logs</h2>
      </div>

      <!-- Access Denied Alert -->
      <div id="access-denied" class="alert alert-error" style="display: none;">
        <strong>Access Denied:</strong> You do not have permission to view audit logs. Only administrators can access this page.
      </div>

      <!-- Filters -->
      <div class="filters-section" id="filters-section" style="display: none;">
        <div class="filter-group">
          <label for="filter-action">Action</label>
          <input type="text" id="filter-action" placeholder="Search action...">
        </div>
        <div class="filter-group">
          <label for="filter-date-from">From Date</label>
          <input type="date" id="filter-date-from">
        </div>
        <div class="filter-group">
          <label for="filter-date-to">To Date</label>
          <input type="date" id="filter-date-to">
        </div>
        <button class="btn-secondary" onclick="applyAuditFilters()">Apply Filters</button>
        <button class="btn-secondary" onclick="resetAuditFilters()">Reset</button>
      </div>

      <!-- Audit Logs Table -->
      <div class="transactions-table" id="logs-table" style="display: none;">
        <table id="audit-table">
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>User</th>
              <th>Email</th>
              <th>Action</th>
              <th>Description</th>
              <th>Table</th>
            </tr>
          </thead>
          <tbody id="audit-logs-body">
            <!-- Logs will be loaded here -->
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="pagination" id="pagination" style="display: none;">
        <button id="prev-btn" class="btn-secondary" onclick="previousAuditPage()">Previous</button>
        <span id="page-info">Page 1</span>
        <button id="next-btn" class="btn-secondary" onclick="nextAuditPage()">Next</button>
      </div>

      <!-- Audit Stats -->
      <div id="audit-stats" style="display: none;">
        <h3>Audit Statistics</h3>
        <div class="stats-grid">
          <div class="stat-card">
            <h4>Actions (Last 24h)</h4>
            <p class="stat-value" id="stats-24h">0</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
