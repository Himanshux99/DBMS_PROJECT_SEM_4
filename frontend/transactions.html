<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CashFlow - Transactions</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="dashboard-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>CashFlow</h1>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link">
          <i data-lucide="layout-dashboard" class="icon"></i> Dashboard
        </a>
        <a href="transactions.html" class="nav-link active">
          <i data-lucide="credit-card" class="icon"></i> Transactions
        </a>
        <a href="analytics.html" class="nav-link">
          <i data-lucide="bar-chart-2" class="icon"></i> Smart Analytics
        </a>
        <a href="audit.html" class="nav-link" id="audit-link" style="display: none;">
          <i data-lucide="clipboard-list" class="icon"></i> Audit Logs
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <p id="user-name">User</p>
          <p id="user-email" class="user-email">email@example.com</p>
        </div>
        <button class="btn-logout" onclick="logout()">
          <i data-lucide="log-out" class="icon"></i> Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="header">
        <h2>Transactions</h2>
      </div>

      <!-- Tab Navigation -->
      <div class="tab-nav">
        <button class="tab-btn active" id="tab-standard" onclick="switchTab('standard')">
          <i data-lucide="list" class="icon"></i> My Transactions
        </button>
        <button class="tab-btn" id="tab-unified" onclick="switchTab('unified')">
          <i data-lucide="git-merge" class="icon"></i> Unified Feed
          <!-- <span class="sql-badge sql-badge-union" style="margin-left: 8px;">UNION</span> -->
        </button>
      </div>

      <!-- Filters -->
      <div class="filters-section">
        <div class="filter-group">
          <label for="filter-type">Type</label>
          <select id="filter-type">
            <option value="">All Types</option>
            <option value="Transfer">Transfer</option>
            <option value="Deposit">Deposit</option>
            <option value="Withdrawal">Withdrawal</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filter-status">Status</label>
          <select id="filter-status">
            <option value="">All Status</option>
            <option value="Completed">Completed</option>
            <option value="Pending">Pending</option>
            <option value="Failed">Failed</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filter-account">Account</label>
          <select id="filter-account">
            <option value="">All Accounts</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filter-date-from">From Date</label>
          <input type="date" id="filter-date-from">
        </div>
        <div class="filter-group">
          <label for="filter-date-to">To Date</label>
          <input type="date" id="filter-date-to">
        </div>
        <button class="btn-secondary" onclick="applyFilters()">Apply Filters</button>
        <button class="btn-secondary" onclick="resetFilters()">Reset</button>
      </div>

      <!-- Transactions Table -->
      <div class="transactions-table">
        <table id="transactions-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Type</th>
              <th>Amount</th>
              <th>From Account</th>
              <th>To Account</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="transactions-body">
            <!-- Transactions will be loaded here -->
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="pagination">
        <button id="prev-btn" class="btn-secondary" onclick="previousPage()">
          <i data-lucide="chevron-left" class="icon"></i> Previous
        </button>
        <span id="page-info">Page 1</span>
        <button id="next-btn" class="btn-secondary" onclick="nextPage()">
          Next <i data-lucide="chevron-right" class="icon" style="margin-right:0; margin-left:8px;"></i>
        </button>
      </div>

      <!-- Unified Feed Panel (UNION) -->
      <div id="unified-feed-panel" style="display: none;">
        <div class="charts-section">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <div>
              <h3 style="margin: 0;">Unified Activity Feed</h3>
              <p style="color: var(--text-secondary); font-size: 13px; margin-top: 4px;">
                <!-- Credits + Debits merged into one timeline using <code>UNION</code> -->
              </p>
            </div>
            <!-- <span class="sql-badge sql-badge-union">SET OPERATION (UNION)</span> -->
          </div>
          <div class="transactions-table">
            <table id="unified-feed-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Type</th>
                  <th>Direction</th>
                  <th>Amount</th>
                  <th>Counterpart</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="unified-feed-body">
                <tr><td colspan="6" style="text-align:center; padding: 40px; color: var(--text-secondary);">Loading unified feed...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
